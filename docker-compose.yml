version: "3.9"

services:
  payment-gateway:
    build:
      context: ./app
    container_name: sentinel-ops-payment-gateway
    ports:
      - "5000:5000"
    environment:
      - FAILURE_RATE=0.1
      - MIN_LATENCY_MS=50
      - MAX_LATENCY_MS=400
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sentinel-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sentinel-ops-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - sentinel-net

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-ops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - sentinel-net
    depends_on:
      - payment-gateway
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-ops-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - sentinel-net
    depends_on:
      - prometheus

networks:
  sentinel-net:
    name: sentinel-net
    driver: bridge

volumes:
  grafana-storage:

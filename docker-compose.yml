version: "3.9"

services:
  payment-gateway:
    build:
      context: ./app
    container_name: sentinel-ops-payment-gateway
    ports:
      - "5000:5000"
    environment:
      - FAILURE_RATE=0.1
      - MIN_LATENCY_MS=50
      - MAX_LATENCY_MS=400
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sentinel-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sentinel-ops-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - sentinel-net

# NOTE for P4: add your prometheus/grafana services to this same file,
# pointing the Prometheus scrape targets at:
#   - payment-gateway:5000/metrics  (application metrics)
#   - node-exporter:9100/metrics    (infrastructure/host metrics)
# so the whole stack comes up together for Integration Gate #1.
# Keep the network name below consistent with whatever P4 uses for
# prometheus/grafana so all containers can reach each other.

networks:
  sentinel-net:
    name: sentinel-net
    driver: bridge

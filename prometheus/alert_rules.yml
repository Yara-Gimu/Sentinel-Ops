groups:
  - name: sentinel-ops-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle",job="node-exporter"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage has exceeded 80% for 2 minutes."

      - alert: HighTransactionFailures
        expr: sum(increase(transaction_failures_total[5m])) >= 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "High transaction failures detected"
          description: "1 or more transaction failures occurred within 5 minutes."